name: Build Windows Host Agent

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-host:
    name: Test & Package KovaHost.exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & test tools
        working-directory: host
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio pyinstaller
          pip install -e . --no-deps

      - name: Run Windows host test suite
        working-directory: host
        run: pytest -v tests/test_host_live.py

      - name: Pre-compile .NET UI Automation helper
        working-directory: host
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $wpf = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\WPF"
          New-Item -ItemType Directory -Force -Path dist-package | Out-Null
          & $csc /nologo /optimize+ /target:exe `
            /out:dist-package\uia_helper.exe `
            "/r:$wpf\UIAutomationClient.dll" `
            "/r:$wpf\UIAutomationTypes.dll" `
            "/r:$wpf\WindowsBase.dll" `
            "/r:C:\Windows\Microsoft.NET\Framework64\v4.0.30319\System.Web.Extensions.dll" `
            kova_host\uia_helper.cs

      - name: Build standalone KovaHost.exe with PyInstaller
        working-directory: host
        run: |
          pyinstaller --noconfirm --onedir --name KovaHost `
            --collect-submodules kova_host `
            --hidden-import PIL._tkinter_finder `
            --add-data "kova_host\uia_helper.cs;kova_host" `
            launcher.py
          Copy-Item -Recurse -Force dist\KovaHost\* dist-package\
          Copy-Item scripts\Start-Kova-CLI.bat dist-package\Start-Kova-CLI.bat
          Copy-Item scripts\Open-Firewall-Port.bat dist-package\Open-Firewall-Port.bat
          Copy-Item scripts\Keep-RDP-Session-Alive.bat dist-package\Keep-RDP-Session-Alive.bat
          Copy-Item scripts\keep-session-alive.ps1 dist-package\keep-session-alive.ps1
          Copy-Item scripts\README-WINDOWS.txt dist-package\README-WINDOWS.txt
          Compress-Archive -Path dist-package\* -DestinationPath ..\kova-host-windows-x64.zip -Force

      - name: Smoke-test extracted KovaHost.exe in isolated directory
        run: |
          $smokeDir = "C:\Temp\kova-host-smoke"
          if (Test-Path $smokeDir) { Remove-Item -Recurse -Force $smokeDir }
          Expand-Archive -Path kova-host-windows-x64.zip -DestinationPath $smokeDir
          $exe = Join-Path $smokeDir "KovaHost.exe"
          $env:KOVA_CONFIG_DIR = Join-Path $smokeDir "cfg"

          $ver = & $exe --version
          Write-Host "Version output: $ver"
          if ($LASTEXITCODE -ne 0 -or $ver -notlike "KovaHost *") { throw "Version smoke test failed!" }

          $pair = & $exe --print-pairing --no-qr | Out-String
          if ($LASTEXITCODE -ne 0 -or $pair -notmatch "kova://connect\?") { throw "Pairing smoke test failed!" }

          $proc = Start-Process -FilePath $exe -ArgumentList "--cli","--port","18765","--no-tls","--no-qr" -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $resp = Invoke-RestMethod -Uri "http://127.0.0.1:18765/api/health" -TimeoutSec 2
                if ($resp.ok -eq $true) {
                  Write-Host "Live /api/health verified: $($resp | ConvertTo-Json -Compress)"
                  $ok = $true
                  break
                }
              } catch {}
            }
            if (-not $ok) { throw "KovaHost.exe failed to respond on /api/health!" }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
          Write-Host "KovaHost.exe smoke test PASSED!"

      - name: Upload Windows Host Package
        uses: actions/upload-artifact@v4
        with:
          name: kova-host-windows-x64
          path: kova-host-windows-x64.zip
          retention-days: 90

      - name: Publish Windows Host ZIP on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: kova-host-windows-x64.zip
