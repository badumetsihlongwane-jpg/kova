name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    name: Test & Build Kova Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Run Android JVM unit tests
        working-directory: android
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Debug & Release APKs
        working-directory: android
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Prepare renamed APK outputs
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/*.apk dist-apk/Kova-release.apk
          cp android/app/build/outputs/apk/debug/*.apk dist-apk/Kova-debug.apk
          ls -lh dist-apk/

      - name: Upload Kova Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: kova-android-apks
          path: dist-apk/*.apk
          retention-days: 90

      - name: Publish Release APKs on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apk/*.apk
